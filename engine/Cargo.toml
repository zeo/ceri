[package]
name = "ceri-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Rust-native browser engine behind the Ceri desktop runtime"

[lib]
name = "ceri_engine"
path = "src/lib.rs"

[features]
default = []
windowed = ["dep:softbuffer", "dep:winit", "dep:windows"]
native-http = ["dep:ureq"]

[dependencies]
brotli-decompressor = "=6.1.0"
softbuffer = { version = "=0.4.8", optional = true }
winit = { version = "=0.30.13", optional = true }
ureq = { version = "=3.4.0", optional = true, default-features = false, features = [
    "gzip",
    "platform-verifier",
    "rustls",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[[bin]]
name = "ceri-engine"
path = "src/main.rs"

[[bin]]
name = "ceri-engine-window"
path = "src/bin/ceri-engine-window.rs"
required-features = ["windowed"]

[package]
name = "ceri-engine"
version = "0.1.6"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "The Rust-native browser engine behind the Ceri desktop runtime"

[lib]
name = "ceri_engine"
path = "src/lib.rs"

[features]
# mimalloc as the allocator of every program built on the engine, which cuts script and layout
# time by a fifth to a third; a program with an allocator of its own turns it off
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
windowed = ["dep:softbuffer", "dep:winit"]
native-http = ["dep:ureq"]
# works out again every cascade, box and width taken from an earlier layout and panics where
# one differs; for the test gates, not for an app
recheck = []

[dependencies]
mimalloc = { version = "=0.1.52", optional = true }
libmimalloc-sys = { version = "=0.1.49", optional = true, features = ["extended"] }
brotli-decompressor = "=6.1.0"
serde_json = "=1.0.154"
softbuffer = { version = "=0.4.8", optional = true }
winit = { version = "=0.30.13", optional = true }
ureq = { version = "=3.4.0", optional = true, default-features = false, features = [
    "gzip",
    "platform-verifier",
    "rustls",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security_Cryptography",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "ceri-engine"
path = "src/main.rs"

[[bin]]
name = "ceri-engine-window"
path = "src/bin/ceri-engine-window.rs"
required-features = ["windowed"]

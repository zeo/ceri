<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 28px;
        background-color: #07131f;
        color: #d8eef2;
      }
      main {
        padding: 24px;
        background-color: #102638;
        border: 2px solid #2c6676;
      }
      h1 {
        margin: 0 0 12px;
        color: #6ee7c5;
        font-size: 28px;
      }
      p {
        margin: 8px 0;
      }
      img {
        display: block;
        width: 520px;
        height: 220px;
        margin: 20px 0 12px;
        border: 2px solid #2c6676;
      }
      .accent {
        color: #ffd479;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>packaged svg laboratory</h1>
      <p>SVG is parsed and rasterized by the custom engine from an app-owned resource.</p>
      <p class="accent">No loopback listener, browser engine, or image library is involved.</p>
      <img src="image-demo.svg" alt="custom svg image">
    </main>
  </body>
</html>

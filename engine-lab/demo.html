<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 28px;
        background-color: #07131f;
        color: #d8eef2;
      }
      main {
        padding: 24px;
        background-color: #102638;
        border: 2px solid #2c6676;
      }
      h1 {
        margin: 0 0 12px;
        color: #6ee7c5;
        font-size: 28px;
      }
      p {
        margin: 8px 0;
      }
      .accent {
        color: #ffd479;
      }
      .meter {
        height: 14px;
        margin: 18px 0 10px;
        background-color: #193c4b;
      }
      .fill {
        display: block;
        width: 68%;
        height: 14px;
        background-color: #42d3b4;
      }
      button {
        display: block;
        margin: 18px 0 10px;
        padding: 8px 12px;
        color: #07131f;
        background-color: #6ee7c5;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ceri engine lab</h1>
      <p>A custom parser, cascade, layout, and paint pipeline.</p>
      <p class="accent">No CEF. No WebKit. No browser engine dependency.</p>
      <div class="meter"><span class="fill"></span></div>
      <button id="run-check">run custom script</button>
      <p id="status">first vertical slice / software paint / deterministic output</p>
    </main>
  </body>
  <script>
    const button = document.getElementById("run-check");
    const status = document.getElementById("status");
    button.addEventListener("click", () => {
      status.textContent = "custom script handled the click";
      status.style.color = "#6ee7c5";
    });
    console.log("custom script runtime ready");
  </script>
</html>

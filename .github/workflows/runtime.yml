name: runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime.yml"
      - "src/**"
      - "engine/**"
      - "web/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/runtime.yml"
      - "src/**"
      - "engine/**"
      - "web/**"
      - "sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: install linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxkbcommon-dev
      - name: test
        run: cargo test --locked --all-targets
      - name: test262 subset
        run: cargo test --locked --release -p ceri-engine --test test262 -- --ignored
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: render the packaged app without a window
        shell: bash
        run: |
          cargo run --locked --bin ceri -- \
            "--ceri-assets=." "--ceri-entry=web/index.html" "--ceri-screenshot=target/app.png"
          test -s target/app.png
      - name: bundle
        run: cargo run --locked --bin ceri_bundle -- --debug --output dist/ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

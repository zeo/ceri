name: engine

on:
  push:
    paths:
      - ".github/workflows/engine.yml"
      - "engine/**"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/engine.yml"
      - "engine/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, native-http, windowed, "windowed native-http"]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: test
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo test --locked -p ceri-engine --all-targets
          else
            cargo test --locked -p ceri-engine --features "${{ matrix.features }}" --all-targets
          fi
      - name: clippy
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "default" ]; then
            cargo clippy --locked -p ceri-engine --all-targets -- -D warnings
          else
            cargo clippy --locked -p ceri-engine --features "${{ matrix.features }}" --all-targets -- -D warnings
          fi

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: check format
        run: cargo fmt --all -- --check

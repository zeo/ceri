[workspace]
members = ["engine", "build"]
resolver = "3"

[package]
name = "ceri"
version = "0.1.11"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A Rust-owned desktop web runtime with its own browser engine"

[[bin]]
name = "ceri"
path = "src/main.rs"

[[bin]]
name = "ceri_bundle"
path = "src/bin/ceri_bundle/main.rs"

[features]
# mimalloc as the allocator, faster for script and layout; an app that settles lower on the
# system allocator depends on ceri with default-features = false
default = ["mimalloc"]
mimalloc = ["ceri-engine/mimalloc"]

[dependencies]
ceri-build = { path = "build" }
ceri-engine = { path = "engine", default-features = false, features = ["windowed"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
] }
windows-core = "=0.62.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
x11rb = "=0.13.2"

# windows reaches the network through the platform stack, other targets use the engine client
[target.'cfg(not(target_os = "windows"))'.dependencies]
ceri-engine = { path = "engine", default-features = false, features = ["windowed", "native-http"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

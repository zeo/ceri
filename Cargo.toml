[workspace]
members = ["engine"]
resolver = "3"

[package]
name = "ceri"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A Rust-owned desktop web runtime with its own browser engine"

[[bin]]
name = "ceri"
path = "src/main.rs"

[[bin]]
name = "ceri_bundle"
path = "src/bin/ceri_bundle.rs"

[dependencies]
ceri-engine = { path = "engine", features = ["windowed"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }

# windows reaches the network through the platform stack, other targets use the engine client
[target.'cfg(not(target_os = "windows"))'.dependencies]
ceri-engine = { path = "engine", features = ["windowed", "native-http"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
